version: 2

models:
  - name: int_company_officers
    description: "One row per company-officer relationship, joining companies and officers."
    columns:
      - name: company_number
        tests:
          - not_null
      - name: officer_name
        tests:
          - not_null

  - name: int_officer_appointment_counts
    description: "Aggregated count of current company appointments per officer (approximate identity matching — see model comments)."
    columns:
      - name: officer_name
        tests:
          - not_null
      - name: company_count
        tests:
          - not_null
      - name: is_corporate_officer
        description: "True if this 'officer' is a corporate entity (a company acting as director/secretary) rather than an individual — identified by missing date of birth."

  - name: int_filing_timeline
    description: "Filing history joined to company details, with year/quarter breakdowns for trend analysis."
    columns:
      - name: company_number
        tests:
          - not_null

  - name: int_company_incorporations
    description: "Companies classified by type (manufacturer/wholesaler/retailer) based on SIC code, with incorporation year extracted."
    columns:
      - name: company_number
        tests:
          - not_null
          - unique
      - name: company_type
        tests:
          - not_null